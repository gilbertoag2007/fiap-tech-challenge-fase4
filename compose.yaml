x-api-image: &api-image
  image: fiap-tech-challenge-fase4-api:local
  build: ./analise-medica-api

services:
  dataset-init:
    <<: *api-image
    restart: "no"
    command: ["python", "-m", "fisioterapia", "prepare"]
    environment:
      FISIOTERAPIA_DATA_DIR: /app/data/fisioterapia
    volumes:
      - ./analise-medica-api/data:/app/data
  backend:
    <<: *api-image
    depends_on:
      dataset-init:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file:
      - path: ./.env
        required: false
    environment:
      FISIOTERAPIA_DATA_DIR: /app/data/fisioterapia
    volumes:
      - ./analise-medica-api/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5500}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
